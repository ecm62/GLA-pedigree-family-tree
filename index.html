<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>永久固定數據卡與靜態世系圖系統</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 12px; background-color: #f8f9fa; }
        
        /* 1. 控制列 */
        .control-bar { background: #ffffff; padding: 10px 15px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        input[type="text"] { padding: 6px 10px; font-size: 14px; border: 1px solid #ced4da; border-radius: 4px; width: 220px; }
        
        .btn { padding: 6px 12px; font-size: 14px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #0b5ed7; }
        .btn-breed { background-color: #6c757d; margin-right: 2px; padding: 5px 10px; font-size: 13px; }
        .btn-breed.active { background-color: #198754; font-weight: bold; }
        
        /* 2. 圖例欄 */
        .legend-bar { display: flex; gap: 10px; font-size: 13px; background: #fff; padding: 8px 12px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .color-box { width: 14px; height: 14px; border-radius: 2px; border: 1px solid #999; }
        
        /* 3. 🌟 永久固定框架 (完全沒有關閉按鈕，永遠顯眼卡在畫面上方) */
        #permanentCard {
            background-color: #ffffff;
            border: 2px solid #0d6efd;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            display: block !important; /* 強制永遠顯示 */
        }
        .card-title { font-size: 15px; color: #0d6efd; font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed #0d6efd; padding-bottom: 4px; }

        /* 雙欄精簡兩行表格 */
        .compact-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .compact-table td { border: 1px solid #dee2e6; padding: 5px 8px; }
        .compact-table .lbl { background-color: #f1f3f5; font-weight: bold; width: 14%; text-align: right; }
        .compact-table .val { width: 36%; font-weight: 500; color: #111; }
        .gen-badge { background-color: #e7f5ff; color: #1c7ed6; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

        /* 4. 世系樹畫布容器 */
        #network { width: 100%; height: 580px; background-color: #ffffff; border: 1px solid #dee2e6; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- 1. 搜尋與品種過濾控制列 -->
    <div class="control-bar">
        <div>
            <label for="earInput"><strong>搜尋耳號：</strong></label>
            <input type="text" id="earInput" placeholder="例如: DD26002 或 LY3492">
            <button class="btn" onclick="applyFilters()">🔍 搜尋比對</button>
        </div>

        <div>
            <strong>品種關聯：</strong>
            <button class="btn btn-breed active" onclick="setBreedFilter('ALL', this)">全部關聯</button>
            <button class="btn btn-breed" onclick="setBreedFilter('L', this)">只看 L 關聯</button>
            <button class="btn btn-breed" onclick="setBreedFilter('Y', this)">只看 Y 關聯</button>
            <button class="btn btn-breed" onclick="setBreedFilter('D', this)">只看 D 關聯</button>
            <button class="btn btn-breed" onclick="setBreedFilter('LY', this)">只看 LY 關聯</button>
        </div>
    </div>

    <!-- 2. 世代顏色圖例 -->
    <div class="legend-bar" id="legendContainer">
        <strong>世代紅色階梯：</strong>
    </div>

    <!-- 3. 🌟 永久固定在最上方的育種數據面板 (無彈窗、無關閉按鈕，永遠固定在圖正上方) -->
    <div id="permanentCard">
        <div class="card-title" id="cardTitle">📌 育種與生產數據摘要 (請點選下方世系圖中的耳號)</div>
        <div id="cardBody">
            <table class="compact-table">
                <tr>
                    <td class="lbl">代次 / 品種:</td>
                    <td class="val"><span class="gen-badge">尚未點選</span> | <b>-</b></td>
                    <td class="lbl">生產指數:</td>
                    <td class="val"><b>SPI:</b> - | <b>MLI:</b> - | <b>TSI:</b> -</td>
                </tr>
                <tr>
                    <td class="lbl">出生日期:</td>
                    <td class="val">-</td>
                    <td class="lbl">同胎數據:</td>
                    <td class="val">總產: <b>-</b> | 活胎: <b>-</b> | 離乳: <b>-</b> (均重: - kg)</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 4. 世系圖畫布 -->
    <div id="network"></div>

    <script>
        let network = null;
        let allNodes = [];
        let allEdges = [];
        let maxGeneration = 3;
        let currentBreedFilter = 'ALL';

        function getDynamicGenColor(genNum, maxGen) {
            const validGen = genNum || 1;
            if (maxGen <= 1) maxGen = 2;
            const ratio = (validGen - 1) / (maxGen - 1);
            const r = Math.round(139 + (255 - 139) * ratio);
            const g = Math.round(0 + (228 - 0) * ratio);
            const b = Math.round(0 + (225 - 0) * ratio);

            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            const fontColor = ratio < 0.4 ? "#FFFFFF" : "#000000";
            return { background: hex, fontColor: fontColor };
        }

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                allNodes = data.nodes;
                allEdges = data.edges;

                maxGeneration = Math.max(...allNodes.map(n => n.gen_num || 1), 3);
                updateLegendUI();
                applyFilters();
            });

        function updateLegendUI() {
            const container = document.getElementById('legendContainer');
            container.innerHTML = '<strong>世代紅色階梯：</strong>';

            for (let g = 1; g <= maxGeneration; g++) {
                const color = getDynamicGenColor(g, maxGeneration);
                container.innerHTML += `
                    <span class="legend-item">
                        <span class="color-box" style="background: ${color.background};"></span> 第 ${g} 代
                    </span>`;
            }
            container.innerHTML += `
                <span class="legend-item"><span class="color-box" style="background: #FF8C00;"></span> 配種公</span>
                <span style="margin-left: 6px;">｜</span>
                <span class="legend-item"><strong>⬜ 方形</strong>：公豬</span>
                <span class="legend-item"><strong>⭕ 圓形</strong>：母豬</span>`;
        }

        function setBreedFilter(breed, btn) {
            currentBreedFilter = breed;
            document.querySelectorAll('.btn-breed').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const rawInput = document.getElementById('earInput').value.trim();
            
            let baseNodeIds = new Set();
            if (rawInput) {
                const searchTerms = rawInput.split(/[,，]/).map(s => s.trim().toLowerCase()).filter(s => s !== '');
                searchTerms.forEach(term => {
                    allNodes.forEach(node => {
                        if (node.id.toLowerCase().includes(term)) baseNodeIds.add(node.id);
                    });
                });

                const expanded = new Set(baseNodeIds);
                allEdges.forEach(e => {
                    if (baseNodeIds.has(e.from) || baseNodeIds.has(e.to)) {
                        expanded.add(e.from);
                        expanded.add(e.to);
                    }
                });
                baseNodeIds = expanded;
            } else {
                allNodes.forEach(n => baseNodeIds.add(n.id));
            }

            let validNodes = allNodes.filter(n => baseNodeIds.has(n.id));

            if (currentBreedFilter !== 'ALL') {
                const filterTag = currentBreedFilter.toUpperCase();
                const breedRelatedIds = new Set();

                validNodes.forEach(node => {
                    const bStr = (node.breed || '').toUpperCase();
                    if (bStr.includes(filterTag)) breedRelatedIds.add(node.id);
                });

                allEdges.forEach(e => {
                    const fromNode = allNodes.find(n => n.id === e.from);
                    const toNode = allNodes.find(n => n.id === e.to);
                    
                    const fromBreed = (fromNode ? fromNode.breed : '').toUpperCase();
                    const toBreed = (toNode ? toNode.breed : '').toUpperCase();

                    if (fromBreed.includes(filterTag) || toBreed.includes(filterTag)) {
                        if (baseNodeIds.has(e.from)) breedRelatedIds.add(e.from);
                        if (baseNodeIds.has(e.to)) breedRelatedIds.add(e.to);
                    }
                });

                validNodes = validNodes.filter(n => breedRelatedIds.has(n.id));
            }

            const finalNodeIds = new Set(validNodes.map(n => n.id));
            const validEdges = allEdges.filter(e => finalNodeIds.has(e.from) && finalNodeIds.has(e.to));

            renderOrthogonalGraph(validNodes, validEdges);
        }

        function renderOrthogonalGraph(nodesData, edgesData) {
            const container = document.getElementById('network');

            const formattedNodes = nodesData.map(node => {
                let colorScheme = getDynamicGenColor(node.gen_num || 1, maxGeneration);
                if (node.is_mate) {
                    colorScheme = { background: '#FF8C00', fontColor: '#FFFFFF' };
                }

                return {
                    id: node.id,
                    label: node.label || node.id,
                    shape: node.shape || 'ellipse',
                    color: {
                        background: colorScheme.background,
                        border: '#333333',
                        highlight: { background: colorScheme.background, border: '#000000' }
                    },
                    font: { size: 14, color: colorScheme.fontColor },
                    borderWidth: 2,
                    margin: 10
                };
            });

            const formattedEdges = edgesData.map((edge, idx) => ({
                id: 'e_' + idx,
                from: edge.from,
                to: edge.to,
                label: edge.label || '',
                font: { size: 11, align: 'top', background: '#ffffff' }
            }));

            const data = {
                nodes: new vis.DataSet(formattedNodes),
                edges: new vis.DataSet(formattedEdges)
            };

            const options = {
                physics: { enabled: false }, // 靜態不抖動
                layout: {
                    hierarchical: {
                        enabled: true,
                        direction: 'LR',           // 由左至右階層排列
                        sortMethod: 'directed',
                        levelSeparation: 250,
                        nodeSpacing: 80,
                        treeSpacing: 120,
                        blockShifting: false,
                        edgeMinimization: true,
                        parentCentralization: true
                    }
                },
                nodes: { borderWidthSelected: 3 },
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: 0.8 } },
                    smooth: {
                        enabled: true,
                        type: 'cubicBezier',
                        forceDirection: 'horizontal',
                        roundness: 0.0             // 90度直角折線
                    },
                    color: { color: '#666666', highlight: '#000000' }
                }
            };

            if (network !== null) network.destroy();
            network = new vis.Network(container, data, options);

            // 點擊耳號 ➔ 更新固定面板
            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const selectedId = params.nodes[0];
                    const selectedNode = allNodes.find(n => n.id === selectedId);
                    if (selectedNode) {
                        updatePermanentDataCard(selectedNode);
                    }
                }
            });

            // 預設填入第一個耳號數據
            if (nodesData.length > 0) {
                const firstNode = allNodes.find(n => n.id === nodesData[0].id);
                if (firstNode) updatePermanentDataCard(firstNode);
            }
        }

        // 即時更新固定面板的內容
        function updatePermanentDataCard(node) {
            document.getElementById('cardTitle').innerText = `📌 耳號：${node.id} - 育種與生產數據摘要`;
            const container = document.getElementById('cardBody');
            
            const genNum = node.gen_num || 1;
            const genText = node.is_mate ? `第 ${genNum} 代 (當胎配種公)` : `第 ${genNum} 代`;
            const details = node.details || {};

            const getVal = (keyStr) => {
                const foundKey = Object.keys(details).find(k => k.toLowerCase().includes(keyStr.toLowerCase()));
                return (foundKey && details[foundKey] !== '') ? details[foundKey] : '-';
            };

            const breed = getVal('Breed');
            const parity = getVal('Parity');
            const dob = getVal('DOB');
            const spi = getVal('SPI');
            const mli = getVal('MLI');
            const tsi = getVal('TSI');
            const totalBorn = getVal('Total born');
            const bornAlive = getVal('Born alive');
            const weaning = getVal('Weaning');
            const weaningWt = getVal('weaning weight');

            const html = `
                <table class="compact-table">
                    <tr>
                        <td class="lbl">代次 / 品種:</td>
                        <td class="val"><span class="gen-badge">${genText}</span> | <b>${breed}</b> (胎次: ${parity})</td>
                        <td class="lbl">生產指數:</td>
                        <td class="val"><b>SPI:</b> ${spi} | <b>MLI:</b> ${mli} | <b>TSI:</b> ${tsi}</td>
                    </tr>
                    <tr>
                        <td class="lbl">出生日期:</td>
                        <td class="val">${dob}</td>
                        <td class="lbl">同胎數據:</td>
                        <td class="val">總產: <b>${totalBorn}</b> | 活胎: <b>${bornAlive}</b> | 離乳: <b>${weaning}</b> (均重: ${weaningWt} kg)</td>
                    </tr>
                </table>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
