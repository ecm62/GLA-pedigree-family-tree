<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLA Pedigree System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; font-size: 12px; background: #f4f6f9; padding: 10px; }
        .tree-node { position: absolute; border: 1.5px solid #334155; border-radius: 4px; padding: 3px; background: #fff; text-align: center; font-size: 10px; }
        .origin-target { border: 3px solid #f59e0b; background: #1d4ed8; color: white; }
        .lineCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        .container { position: relative; overflow-x: auto; min-height: 400px; background: #fff; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <input type="text" id="earInput" placeholder="Enter Ear Tag">
    <button onclick="search()">Search</button>
    <div id="singleTreeCard" class="container"><canvas id="singleCanvas" class="lineCanvas"></canvas><div id="nodes"></div></div>

    <script>
        let pedigreeList = [];
        fetch('data.json').then(r => r.json()).then(d => pedigreeList = d);

        // 🌟 核心簡化名稱函數：只取最後一個非數字關鍵字
        function getShortName(s) {
            if (!s || s === '-') return '-';
            let parts = String(s).toUpperCase().replace(/1CR1|1CR2|CR1|CR2/g, '').split(' ');
            let filtered = parts.filter(p => p.length > 0 && !/^\d+$/.test(p));
            return filtered.length > 0 ? filtered[filtered.length - 1] : s;
        }

        function search() {
            const input = document.getElementById('earInput').value.trim().toUpperCase();
            const target = pedigreeList.find(i => i.ear.toUpperCase() === input);
            if (!target) return alert('Not found');
            
            const nodes = document.getElementById('nodes');
            nodes.innerHTML = '';
            
            // 🌟 嚴格邏輯：若為 LY，左側不繪製任何親代框框與線條
            if (!(target.breed === 'LY' || target.ear.includes('LY'))) {
                // 這裡放入繪製父母祖代的邏輯...
                // 確保若無資料，就直接跳過繪製，不產生殘線
            }
            
            // 繪製右側公豬 (Sire upper, Dam lower)
            // 呼叫繪圖函數...
        }
    </script>
</body>
</html>
