<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>血統世系圖視覺化系統</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; }
        .control-bar { background: #ffffff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        input[type="text"] { padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
        button { padding: 8px 16px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .btn-toggle { background-color: #28a745; }
        .btn-toggle:hover { background-color: #218838; }
        #network { width: 100%; height: 750px; background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="control-bar">
        <label for="earInput"><strong>查詢耳號：</strong></label>
        <input type="text" id="earInput" placeholder="例如: D1052 或 y1266">
        <button onclick="searchEarTag()">🔍 查詢世系樹</button>
        <button class="btn-toggle" onclick="toggleLayout()">🔄 切換模式 (世代樹狀圖 / 全景蜘蛛網)</button>
    </div>

    <div id="network"></div>

    <script>
        let network = null;
        let allNodes = [];
        let allEdges = [];
        let isTreeMode = true; // 預設使用你最喜歡的「世代分層樹狀圖」

        // 載入 JSON 資料
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                allNodes = data.nodes;
                allEdges = data.edges;
                renderGraph(allNodes, allEdges);
            })
            .catch(err => console.error("無法讀取 data.json:", err));

        function renderGraph(nodesData, edgesData) {
            const container = document.getElementById('network');
            const data = {
                nodes: new vis.DataSet(nodesData),
                edges: new vis.DataSet(edgesData)
            };

            const options = {
                layout: {
                    hierarchical: isTreeMode ? {
                        enabled: true,
                        direction: 'LR', // LR = Left to Right (由左至右橫向排列，就跟你第一張 Excel 圖一模一樣！)
                        sortMethod: 'directed',
                        levelSeparation: 220,
                        nodeSpacing: 100
                    } : { enabled: false }
                },
                physics: {
                    enabled: !isTreeMode, // 樹狀模式下關閉物理漂浮，保持乾淨對齊
                    solver: 'forceAtlas2Based'
                },
                nodes: {
                    shape: 'box',
                    margin: 10,
                    font: { size: 14, color: '#333333' },
                    color: { background: '#e3f2fd', border: '#2196f3' }
                },
                edges: {
                    arrows: { to: { enabled: true, scaleFactor: 0.8 } },
                    font: { size: 11, align: 'top' },
                    color: { color: '#888888' },
                    smooth: { type: 'cubicBezier' }
                }
            };

            if (network !== null) network.destroy();
            network = new vis.Network(container, data, options);
        }

        // 耳號搜尋功能
        function searchEarTag() {
            const ear = document.getElementById('earInput').value.trim();
            if (!ear) {
                renderGraph(allNodes, allEdges);
                return;
            }

            // 搜尋該耳號以及與其有血統關聯的上線/下線點位
            const relatedNodes = new Set([ear]);
            allEdges.forEach(edge => {
                if (edge.from === ear || edge.to === ear) {
                    relatedNodes.add(edge.from);
                    relatedNodes.add(edge.to);
                }
            });

            const filteredNodes = allNodes.filter(n => relatedNodes.has(n.id));
            const filteredEdges = allEdges.filter(e => relatedNodes.has(e.from) && relatedNodes.has(e.to));

            if (filteredNodes.length === 0) {
                alert("找不到該耳號！請確認輸入是否正確。");
                return;
            }

            renderGraph(filteredNodes, filteredEdges);
        }

        // 切換世代樹狀圖 / 蜘蛛網圖
        function toggleLayout() {
            isTreeMode = !isTreeMode;
            const currentInput = document.getElementById('earInput').value.trim();
            if (currentInput) {
                searchEarTag();
            } else {
                renderGraph(allNodes, allEdges);
            }
        }
    </script>
</body>
</html>
