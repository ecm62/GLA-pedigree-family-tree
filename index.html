<script>
        const AUDIT_LOG_API_URL = 'https://script.google.com/macros/s/AKfycbyurKMvk_ZxlSLTuckWsgSXbl7mzzn-BEpaH-WSxUzvyOPFuWvUwNfASttIv5QBqSiS9w/exec';

        let pedigreeList = [];
        let selectedBreeds = new Set(['LY', 'Y', 'L', 'D']);
        let userIP = 'Unknown';
        let isAuthorized = false;
        let userRole = 'B';

        // 🌟 核心修正 1：網頁一打開，立刻強制背景連結並下載 data.json
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => { userIP = data.ip || 'Unknown'; })
                .catch(err => { userIP = 'Unknown'; });

            // 無論是否登入，優先連結資料庫
            loadPedigreeData();
        });

        function getTodayDateStr() {
            const d = new Date();
            return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
        }

        function calculateAgeInDays(breed, birthDateStr, endDateStr) {
            const bClean = String(breed || '').toUpperCase();
            if (bClean.includes('LY') || !birthDateStr || birthDateStr === '-' || birthDateStr === '未記載') return '-';
            try {
                const bDate = new Date(birthDateStr.replace(/-/g, '/'));
                if (isNaN(bDate.getTime())) return '-';
                const today = new Date();
                if (bDate > today) return '-';

                let targetDate = today;
                if (endDateStr && endDateStr !== '-' && endDateStr !== '未記載') {
                    const eDate = new Date(endDateStr.replace(/-/g, '/'));
                    if (!isNaN(eDate.getTime())) targetDate = eDate;
                }
                const diffDays = Math.floor((targetDate.getTime() - bDate.getTime()) / (1000 * 60 * 60 * 24));
                return (diffDays > 0 && diffDays < 4000) ? `${diffDays}d` : '-';
            } catch(e) { return '-'; }
        }

        function verifyPassword() {
            const pwdInput = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');
            if (!pwdInput) return;

            let authSuccess = false;
            if (pwdInput === 'gnay') { userRole = 'A'; authSuccess = true; }
            else if (pwdInput === 'yang') { userRole = 'B'; authSuccess = true; }

            if (authSuccess) {
                isAuthorized = true;
                document.getElementById('authOverlay').style.display = 'none';
                if (pedigreeList.length === 0) loadPedigreeData();
            } else {
                errorDiv.style.display = 'block';
                document.getElementById('authPassword').value = '';
                document.getElementById('authPassword').focus();
            }
        }

        // 🌟 核心修正 2：加強資料庫讀取與 Log 監控
        function loadPedigreeData() {
            console.log("🔄 正在嘗試與 data.json 資料庫連線...");
            fetch('data.json?nocache=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error("Network response was not ok: " + res.status);
                    return res.json();
                })
                .then(data => { 
                    pedigreeList = Array.isArray(data) ? data : Object.values(data || {}); 
                    console.log(`✅ 資料庫連線成功！已載入 ${pedigreeList.length} 筆筆數據。`);
                })
                .catch(err => console.error("❌ 資料庫連線失敗:", err));
        }

        function getBreedClass(nameStr, parentBreedFallback = 'DD') {
            if (!nameStr || nameStr === '-' || nameStr.includes('未記載') || nameStr === '') return 'breed-DEFAULT';
            const cleanName = String(nameStr).toUpperCase().trim();

            if (cleanName.includes('LY') || cleanName.includes('CROSSBREED')) return 'breed-LY';
            if (cleanName.includes('DD') || cleanName.startsWith('D') || cleanName.includes('DUROC')) return 'breed-D';
            if (cleanName.includes('YY') || cleanName.startsWith('Y') || cleanName.includes('YORK')) return 'breed-Y';
            if (cleanName.includes('LL') || cleanName.startsWith('L') || cleanName.includes('LAND')) return 'breed-L';
            return 'breed-DEFAULT';
        }

        function toggleBreedFilter(breedKey) {
            if (!isAuthorized) return;
            if (breedKey === 'ALL') {
                selectedBreeds = selectedBreeds.size === 4 ? new Set() : new Set(['LY', 'Y', 'L', 'D']);
            } else {
                if (selectedBreeds.has(breedKey)) selectedBreeds.delete(breedKey);
                else selectedBreeds.add(breedKey);
            }
            document.getElementById('btnBreedLY').classList.toggle('active', selectedBreeds.has('LY'));
            document.getElementById('btnBreedY').classList.toggle('active', selectedBreeds.has('Y'));
            document.getElementById('btnBreedL').classList.toggle('active', selectedBreeds.has('L'));
            document.getElementById('btnBreedD').classList.toggle('active', selectedBreeds.has('D'));
            document.getElementById('btnBreedALL').classList.toggle('active', selectedBreeds.size === 4);

            if (document.getElementById('earInput').value.trim() !== '') searchPedigree();
        }

        function checkBreedAllowed(breedStr, earStr) {
            if (!selectedBreeds || selectedBreeds.size === 0) return true;
            const bClass = getBreedClass(earStr || breedStr);
            if (bClass === 'breed-DEFAULT') return true;
            return selectedBreeds.has(bClass.replace('breed-', ''));
        }

        function cleanVal(v) {
            if (v === undefined || v === null || v === 'undefined' || v === 'NaN' || v === 'nan' || v === '') return '-';
            return String(v).replace(/\n/g, ' ').replace(/🔴/g, '').trim();
        }

        function shortenAncestorName(nameStr) {
            if (!nameStr || nameStr === '-' || nameStr === '未記載' || nameStr === '') return '-';
            let s = String(nameStr).trim();
            const parts = s.split(' ');
            let keywords = parts.filter(p => !/^\d+[\-\d]*$/.test(p) && !['1CR1', '1CR2', 'CR1', 'CR2'].includes(p.toUpperCase()));
            if (keywords.length > 0) {
                let last = keywords[keywords.length - 1];
                if (/\d/.test(last) && keywords.length > 1) keywords.pop();
                return keywords.join(' ');
            }
            return s;
        }

        function cleanParityVal(v) {
            if (!v || v === '-' || v === 'undefined' || v === 'NaN') return '-';
            const num = parseFloat(v);
            return isNaN(num) ? '-' : num.toFixed(1);
        }

        function getValueFromMultiKeys(obj, possibleKeys) {
            if (!obj) return '-';
            const sanitize = s => String(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
            for (let kCandidate of possibleKeys) {
                const targetK = sanitize(kCandidate);
                for (let rawK in obj) {
                    if (sanitize(rawK).includes(targetK)) {
                        const val = obj[rawK];
                        if (val !== undefined && val !== null && !['nan', 'none', '', 'undefined'].includes(String(val).toLowerCase())) {
                            return String(val).trim();
                        }
                    }
                }
            }
            return '-';
        }

        function getMatingDateForParity(item, rowIndex) {
            const parityNum = Math.round(parseFloat(item.parity || getValueFromMultiKeys(item, ['胎次', 'Parity'])));
            if (item.details) {
                for (let k in item.details) {
                    const lk = k.toLowerCase();
                    if (lk.includes('配種日期') || lk.includes('mating date')) {
                        if (!isNaN(parityNum) && parityNum > 0 && (lk.includes(`_${parityNum}`) || lk.includes(` ${parityNum}`))) {
                            let val = item.details[k];
                            if (val && val !== '-' && val !== 'nan') return cleanVal(val);
                        }
                    }
                }
            }
            let dates = [];
            let sourceObj = item.details || item;
            for (let k in sourceObj) {
                const lk = k.toLowerCase();
                if (lk.includes('配種日期') || lk.includes('mating date')) {
                    let v = sourceObj[k];
                    if (v && v !== '-' && v !== 'nan') {
                        let cleanD = cleanVal(v);
                        if (cleanD !== '-' && !dates.includes(cleanD)) dates.push(cleanD);
                    }
                }
            }
            if (dates.length > 0) {
                if (!isNaN(parityNum) && parityNum > 0 && parityNum <= dates.length) return dates[parityNum - 1];
                return dates[rowIndex < dates.length ? rowIndex : dates.length - 1];
            }
            return '-';
        }

        function getMatingBoar(item) {
            if (item.mate && item.mate !== '-') return item.mate;
            if (item.matingBoar && item.matingBoar !== '-') return item.matingBoar;
            return getValueFromMultiKeys(item, ['當胎配種', 'mate', 'matingBoar', 'Sire']);
        }

        function checkIsMale(item) {
            if (!item) return false;
            const sexStr = (item.sex || getValueFromMultiKeys(item, ['Sex', '性別']) || '').toUpperCase();
            if (sexStr.includes('FEMALE')) return false;
            if (sexStr.includes('MALE') || sexStr.includes('公')) return true;
            const earStr = (item.ear || '').toUpperCase();
            return (earStr.startsWith('D') && !earStr.startsWith('DD'));
        }

        function getHierarchyAncestors(items, targetItem) {
            const breed = String(targetItem.breed || getValueFromMultiKeys(targetItem, ['品種'])).toUpperCase();
            const ear = String(targetItem.ear || '').toUpperCase();
            
            if (breed.includes('LY') || ear.startsWith('LY')) {
                return {
                    sireSide: [ { name: '-', label: '' }, { name: '-', label: '' }, { name: '-', label: '' } ],
                    damSide: [ { name: '-', label: '' }, { name: '-', label: '' }, { name: '-', label: '' } ]
                };
            }

            let usSireSire = getValueFromMultiKeys(targetItem, ['Sire美系父親名(祖父)', 'sire_sire', '祖父']);
            let usSireDam  = getValueFromMultiKeys(targetItem, ['Dam Name美系母親名(祖母)', 'sire_dam', '祖母']);
            let usDamSire  = getValueFromMultiKeys(targetItem, ['Sire美系父親名(外公)', 'dam_sire', '外公']);
            let usDamDam   = getValueFromMultiKeys(targetItem, ['Dam Name美系母親名(外婆)', 'dam_dam', '外婆']);

            let gen1Sire = getValueFromMultiKeys(targetItem, ['第一代公', '1st Sire', 'gen1_sire', '父親']);
            let gen1Dam  = getValueFromMultiKeys(targetItem, ['第一代母', '1st Dam', 'gen1_dam', '母親']);

            return {
                sireSide: [
                    { name: shortenAncestorName(usSireSire), label: '♂ Sire\'s Sire (祖父)' },
                    { name: shortenAncestorName(usSireDam),  label: '♀ Sire\'s Dam (祖母)' },
                    { name: shortenAncestorName(gen1Sire),   label: '♂ 1st Sire (父親)' }
                ],
                damSide: [
                    { name: shortenAncestorName(gen1Dam),    label: '♀ 1st Dam (母親)' },
                    { name: shortenAncestorName(usDamSire),  label: '♂ Dam\'s Sire (外公)' },
                    { name: shortenAncestorName(usDamDam),   label: '♀ Dam\'s Dam (外婆)' }
                ]
            };
        }

        function attachNodeClick(divNode, earName) {
            if (!earName || earName === '-' || earName === '未記載' || earName === '') return;
            divNode.style.cursor = 'pointer';
            divNode.onclick = () => { document.getElementById('earInput').value = earName; searchPedigree(); };
        }

        // 🌟 核心修正 3：搜尋前自動防呆——如果發現資料庫尚未載入，立刻補連線
        function searchPedigree() {
            if (!isAuthorized) return;

            if (!pedigreeList || pedigreeList.length === 0) {
                console.warn("⚠️ 資料庫未連線，正在自動重新連線...");
                loadPedigreeData();
                setTimeout(() => searchPedigree(), 300); // 0.3秒後自動再跑一次搜尋
                return;
            }

            const rawInput = document.getElementById('earInput').value.trim();
            if (!rawInput) return;

            const targetTerm = rawInput.toLowerCase();

            let matchedItems = pedigreeList.filter(item => {
                const itemEar = String(item.ear || (item.details && item.details['耳號']) || '').toLowerCase();
                const fullJson = JSON.stringify(item).toLowerCase();
                
                const isEarMatch = itemEar.includes(targetTerm) || fullJson.includes(targetTerm);
                const isBreedMatch = checkBreedAllowed(item.breed, item.ear);
                
                return isEarMatch && isBreedMatch;
            });

            if (matchedItems.length > 0) {
                let primaryMatches = [];
                let relatedMatches = [];
                
                matchedItems.forEach(item => {
                    const itemEar = String(item.ear || (item.details && item.details['耳號']) || '').toLowerCase();
                    if (itemEar.includes(targetTerm)) {
                        primaryMatches.push(item);
                    } else {
                        relatedMatches.push(item);
                    }
                });

                primaryMatches.sort((a, b) => (parseFloat(a.parity) || 0) - (parseFloat(b.parity) || 0));

                const sortedItems = [...primaryMatches, ...relatedMatches];
                const targetItem = primaryMatches[0] || sortedItems[0];

                renderExcelDataTable(sortedItems, primaryMatches, rawInput);
                try { drawSingleLineageTree(primaryMatches.length > 0 ? primaryMatches : sortedItems, targetItem); } catch(e) { console.error(e); }
                try { drawButterflyFamilyTree(primaryMatches.length > 0 ? primaryMatches : sortedItems, targetItem); } catch(e) { console.error(e); }
            } else {
                document.getElementById('singleBoxesContainer').innerHTML = '<div style="padding:30px; text-align:center; color:#888;">No data found</div>';
                document.getElementById('excelTableBody').innerHTML = '<tr><td colspan="21" style="padding:20px; text-align:center; color:#888;">No data found</td></tr>';
            }
        }

        function renderExcelDataTable(allSortedItems, primaryItems, searchTerm) {
            const tbody = document.getElementById('excelTableBody');
            const title = document.getElementById('cardTitle');
            title.innerHTML = `📌 Breeding Performance & Index Data Evaluation Table: <span style="color:#0d6efd;">Query: "${searchTerm}"</span> (Target: ${primaryItems.length})`;

            let html = '';
            allSortedItems.forEach((item, idx) => {
                const mateBoar = getMatingBoar(item);
                const itemEar = item.ear || getValueFromMultiKeys(item, ['耳號', 'Ear Tag']);
                const isPrimary = String(itemEar).toLowerCase().includes(searchTerm.toLowerCase());
                const parityClean = cleanParityVal(item.parity !== '-' ? item.parity : getValueFromMultiKeys(item, ['胎次', 'Parity']));
                const breedVal = cleanVal(item.breed || getValueFromMultiKeys(item, ['品種']));

                let validBirthDate = '-';
                if (!breedVal.toUpperCase().includes('LY')) {
                    let rawBirthDate = cleanVal(item.birth_date);
                    if (rawBirthDate !== '-') {
                        const bTime = new Date(rawBirthDate.replace(/-/g, '/')).getTime();
                        const nowTime = new Date().getTime();
                        if (!isNaN(bTime) && bTime <= nowTime) {
                            validBirthDate = rawBirthDate;
                        }
                    }
                }

                let compareDate = cleanVal(item.dob) !== '-' ? cleanVal(item.dob) : getMatingDateForParity(item, idx);
                const ageDaysVal = calculateAgeInDays(breedVal, validBirthDate !== '-' ? validBirthDate : null, compareDate);

                const spiVal = userRole === 'A' ? cleanVal(item.spi || getValueFromMultiKeys(item, ['spi'])) : '-';
                const mliVal = userRole === 'A' ? cleanVal(item.mli || getValueFromMultiKeys(item, ['mli'])) : '-';
                const tsiVal = userRole === 'A' ? cleanVal(item.tsi || getValueFromMultiKeys(item, ['tsi'])) : '-';

                html += `
                    <tr class="${isPrimary ? 'main-row' : 'rel-row'}">
                        <td><b>${cleanVal(itemEar)}</b></td>
                        <td>${breedVal}</td>
                        <td>${cleanVal(item.sex || getValueFromMultiKeys(item, ['性別']))}</td>
                        <td><b>${validBirthDate}</b></td>
                        <td><b style="color:#0284c7;">${ageDaysVal}</b></td>
                        <td><b>${getMatingDateForParity(item, idx)}</b></td>
                        <td><b>${cleanVal(item.dob)}</b></td>
                        <td><b>${parityClean}</b></td>
                        <td><b>${cleanVal(mateBoar)}</b></td>
                        <td><b>${cleanVal(item.total_born || item.tnb)}</b></td>
                        <td><b>${cleanVal(item.born_alive || item.nba)}</b></td>
                        <td>${cleanVal(item.weaning)}</td>
                        <td>${cleanVal(item.mother_wt)}</td>
                        <td>${cleanVal(item.weaning_wt)}</td>
                        <td><b>${spiVal}</b></td>
                        <td><b>${mliVal}</b></td>
                        <td><b>${tsiVal}</b></td>
                        <td>${cleanVal(item.tnb)}</td>
                        <td>${cleanVal(item.nba)}</td>
                        <td>${cleanVal(item.lteat)}</td>
                        <td>${cleanVal(item.rteat)}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function exportTableAsPNG() {
            const targetElem = document.getElementById('permanentCard');
            const rawQuery = document.getElementById('earInput').value.trim() || 'ALL';
            if (!targetElem) return;

            html2canvas(targetElem, { scale: 2.0, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `GLA_Table_${rawQuery}_${getTodayDateStr()}.png`;
                    link.href = url;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }, 'image/png', 1.0);
            });
        }

        function drawOrthogonalLine(ctx, x1, y1, x2, y2, midX) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(midX, y1);
            ctx.lineTo(midX, y2);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function drawSingleLineageTree(items, targetItem) {
            const container = document.getElementById('singleBoxesContainer');
            const canvas = document.getElementById('singleCanvas');
            const cardContainer = document.getElementById('singleTreeCard');
            if (!container || !canvas) return;

            container.innerHTML = '';
            const boxW = 120, boxH = 32, colGap = 45, rowGap = 50;
            const isMale = checkIsMale(targetItem);
            const ancData = getHierarchyAncestors(items, targetItem);
            const breed = String(targetItem.breed || getValueFromMultiKeys(targetItem, ['品種'])).toUpperCase();
            const ear = String(targetItem.ear || '').toUpperCase();
            const hasLeftAncestors = !(breed.includes('LY') || ear.startsWith('LY'));

            const col2_X = hasLeftAncestors ? 20 + (boxW + colGap) * 2 : 50;
            const col3_X = col2_X + boxW + colGap;

            const targetEar = targetItem.ear || getValueFromMultiKeys(targetItem, ['耳號', 'Ear Tag']);

            let mateList = [];
            items.forEach(i => {
                const iEar = i.ear || getValueFromMultiKeys(i, ['耳號', 'Ear Tag']);
                const boar = isMale ? (iEar !== targetEar ? iEar : '') : getMatingBoar(i);
                if (boar && boar !== '-' && boar !== '未記載公豬') {
                    String(boar).split(' ').forEach(sb => {
                        if (sb.trim() && !mateList.some(m => m.name === sb.trim())) {
                            mateList.push({ name: sb.trim(), label: isMale ? '♀ Mating Dam' : '♂ Mating Sire', parity: cleanParityVal(i.parity) });
                        }
                    });
                }
            });

            const totalMates = Math.max(mateList.length, 1);
            const cardHeight = Math.max(totalMates * rowGap + 80, 300);
            const maxRightX = col3_X + boxW + 60;
            const totalWidth = Math.max(maxRightX, cardContainer.clientWidth || 800);

            cardContainer.style.height = cardHeight + 'px';
            container.style.height = cardHeight + 'px';
            container.style.width = totalWidth + 'px';

            const targetY = cardHeight / 2 - boxH / 2;
            const linesToDraw = [];

            const parentY_Sire = targetY - 38;
            const parentY_Dam  = targetY + 38;

            if (hasLeftAncestors) {
                const col0_X = 20;
                const col1_X = col0_X + boxW + colGap;

                const parents = [
                    { name: ancData.sireSide[2].name, label: "♂ 1st Sire (父親)", y: parentY_Sire, fallbackBreed: targetItem.breed || 'LY', exists: false },
                    { name: ancData.damSide[0].name,  label: "♀ 1st Dam (母親)",  y: parentY_Dam,  fallbackBreed: targetItem.breed || 'LY', exists: false }
                ];

                parents.forEach(p => {
                    if (p.name && p.name !== '' && p.name !== '-') {
                        p.exists = true;
                        const div = document.createElement('div');
                        div.className = `tree-node ${getBreedClass(p.name, p.fallbackBreed)}`;
                        div.style.left = col1_X + 'px'; div.style.top = p.y + 'px';
                        div.style.width = boxW + 'px'; div.style.height = boxH + 'px';
                        div.innerHTML = `<span class="sub-label">${p.label}</span><b>${cleanVal(p.name)}</b>`;
                        attachNodeClick(div, p.name);
                        container.appendChild(div);

                        linesToDraw.push({ x1: col1_X + boxW, y1: p.y + boxH/2, x2: col2_X, y2: targetY + boxH/2, midX: col1_X + boxW + colGap/2 });
                    }
                });

                const ancYs = [targetY - 95, targetY - 38, targetY + 38, targetY + 95];
                const usList = [
                    { data: ancData.sireSide[0], fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.sireSide[1], fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.damSide[1],  fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.damSide[2],  fallbackBreed: targetItem.breed || 'LY' }
                ];

                usList.forEach((itemObj, idx) => {
                    const a = itemObj.data;
                    if (!a || !a.name || a.name === '' || a.name === '-') return;
                    const nodeY = ancYs[idx];
                    const div = document.createElement('div');
                    div.className = `tree-node ${getBreedClass(a.name, itemObj.fallbackBreed)}`;
                    div.style.left = col0_X + 'px'; div.style.top = nodeY + 'px';
                    div.style.width = boxW + 'px'; div.style.height = boxH + 'px';
                    div.innerHTML = `<span class="sub-label">${a.label}</span><b>${cleanVal(a.name)}</b>`;
                    attachNodeClick(div, a.name);
                    container.appendChild(div);

                    let targetDestY = (idx < 2) 
                        ? (parents[0].exists ? parentY_Sire + boxH/2 : targetY + boxH/2)
                        : (parents[1].exists ? parentY_Dam + boxH/2  : targetY + boxH/2);

                    linesToDraw.push({ x1: col0_X + boxW, y1: nodeY + boxH/2, x2: col1_X, y2: targetDestY, midX: col0_X + boxW + colGap/2 });
                });
            }

            const targetDiv = document.createElement('div');
            targetDiv.className = `tree-node origin-target`;
            targetDiv.style.left = col2_X + 'px'; targetDiv.style.top = targetY + 'px';
            targetDiv.style.width = (boxW + 6) + 'px'; targetDiv.style.height = (boxH + 6) + 'px';
            const sexLabel = isMale ? '🎯 Target Sire' : '🎯 Target Dam';
            targetDiv.innerHTML = `<span class="sub-label" style="color:#fef08a;">${sexLabel}</span><b>${cleanVal(targetEar)}</b>`;
            container.appendChild(targetDiv);

            if (mateList.length > 0) {
                mateList.forEach((m, idx) => {
                    const currentY = targetY + (idx - (totalMates - 1) / 2) * rowGap;
                    const mDiv = document.createElement('div');
                    const nodeClass = isMale ? 'mate-node-dam' : 'mate-node-sire';
                    mDiv.className = `tree-node ${nodeClass} ${getBreedClass(m.name, targetItem.breed || 'LY')}`;
                    mDiv.style.left = col3_X + 'px'; mDiv.style.top = currentY + 'px';
                    mDiv.style.width = boxW + 'px'; mDiv.style.height = boxH + 'px';
                    const parityText = (m.parity && m.parity !== '-') ? ` (P.${m.parity})` : '';
                    mDiv.innerHTML = `<span class="sub-label">${m.label}${parityText}</span><b>${cleanVal(m.name)}</b>`;
                    attachNodeClick(mDiv, m.name);
                    container.appendChild(mDiv);

                    linesToDraw.push({ x1: col2_X + boxW, y1: targetY + boxH/2, x2: col3_X, y2: currentY + boxH/2, midX: col2_X + boxW + colGap/2 });
                });
            }

            requestAnimationFrame(() => {
                canvas.width = totalWidth;
                canvas.height = cardHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                linesToDraw.forEach(l => {
                    drawOrthogonalLine(ctx, l.x1, l.y1, l.x2, l.y2, l.midX);
                });
            });
        }

        function drawButterflyFamilyTree(items, targetItem) {
            const container = document.getElementById('macroBoxesContainer');
            const canvas = document.getElementById('macroCanvas');
            const countTag = document.getElementById('macroHeaderCount');
            const headerBar = document.getElementById('genHeaderBar');
            const scrollArea = document.getElementById('macroScrollArea');
            if (!container || !canvas) return;

            container.innerHTML = '';
            headerBar.innerHTML = '';
            const targetEar = targetItem.ear || getValueFromMultiKeys(item, ['耳號', 'Ear Tag']);
            countTag.innerText = `(Topology: Target ${targetEar} Ancestors ➔ Target ➔ Mating Sires ➔ Sire Ancestors)`;

            const boxW = 120, boxH = 32, colGap = 45, rowGap = 55;
            const isMale = checkIsMale(targetItem);
            const ancData = getHierarchyAncestors(items, targetItem);
            const breed = String(targetItem.breed || getValueFromMultiKeys(targetItem, ['品種'])).toUpperCase();
            const ear = String(targetItem.ear || '').toUpperCase();
            const hasLeftAncestors = !(breed.includes('LY') || ear.startsWith('LY'));

            const col2_X = hasLeftAncestors ? 20 + (boxW + colGap) * 2 : 50;
            const col3_X = col2_X + boxW + colGap;
            const col4_X = col3_X + boxW + colGap;
            const col5_X = col4_X + boxW + colGap;

            const headers = hasLeftAncestors ? [
                { text: 'Grandparents (祖代)', x: 20 },
                { text: 'Parents (親本)', x: 20 + boxW + colGap },
                { text: 'Target (個體)', x: col2_X },
                { text: isMale ? 'Mating Dam' : 'Mating Sire', x: col3_X },
                { text: 'Sire Parents', x: col4_X },
                { text: 'Sire Grandparents 👉', x: col5_X }
            ] : [
                { text: 'Target (個體)', x: col2_X },
                { text: isMale ? 'Mating Dam' : 'Mating Sire', x: col3_X },
                { text: 'Sire Parents', x: col4_X },
                { text: 'Sire Grandparents 👉', x: col5_X }
            ];

            headers.forEach(h => {
                const div = document.createElement('div');
                div.className = 'gen-header-title';
                div.style.left = h.x + 'px'; div.style.width = boxW + 'px'; div.innerText = h.text;
                headerBar.appendChild(div);
            });

            let mateList = [];
            items.forEach(i => {
                const iEar = i.ear || getValueFromMultiKeys(i, ['耳號', 'Ear Tag']);
                const boarRaw = isMale ? (iEar !== targetEar ? iEar : '') : getMatingBoar(i);
                if (boarRaw && boarRaw !== '-' && boarRaw !== '未記載公豬') {
                    String(boarRaw).split(' ').forEach(sb => {
                        const cleanBoar = sb.trim();
                        if (cleanBoar) {
                            if (!mateList.some(m => m.name.toLowerCase() === cleanBoar.toLowerCase())) {
                                mateList.push({ name: cleanBoar, label: isMale ? '♀ Mating Dam' : '♂ Mating Sire', parity: cleanParityVal(i.parity) });
                            }
                        }
                    });
                }
            });

            const totalMates = Math.max(mateList.length, 1);
            const finalCanvasHeight = Math.max(totalMates * rowGap * 2.0 + 180, 480);
            const totalWidth = Math.max(col5_X + boxW + 80, scrollArea.clientWidth || 1000);

            scrollArea.style.height = finalCanvasHeight + 'px';
            container.style.height = finalCanvasHeight + 'px';
            container.style.width = totalWidth + 'px';

            const linesToDraw = [];
            const targetY = finalCanvasHeight / 2 - boxH / 2;
            const parentY_Sire = targetY - 38;
            const parentY_Dam  = targetY + 38;

            if (hasLeftAncestors) {
                const col0_X = 20;
                const col1_X = col0_X + boxW + colGap;

                const leftParents = [
                    { name: ancData.sireSide[2].name, label: "♂ 1st Sire (父親)", y: parentY_Sire, fallbackBreed: targetItem.breed || 'LY', exists: false },
                    { name: ancData.damSide[0].name,  label: "♀ 1st Dam (母親)",  y: parentY_Dam,  fallbackBreed: targetItem.breed || 'LY', exists: false }
                ];

                leftParents.forEach(p => {
                    if (p.name && p.name !== '' && p.name !== '-') {
                        p.exists = true;
                        const div = document.createElement('div');
                        div.className = `tree-node ${getBreedClass(p.name, p.fallbackBreed)}`;
                        div.style.left = col1_X + 'px'; div.style.top = p.y + 'px';
                        div.style.width = boxW + 'px'; div.style.height = boxH + 'px';
                        div.innerHTML = `<span class="sub-label">${p.label}</span><b>${cleanVal(p.name)}</b>`;
                        attachNodeClick(div, p.name);
                        container.appendChild(div);

                        linesToDraw.push({ x1: col1_X + boxW, y1: p.y + boxH/2, x2: col2_X, y2: targetY + boxH/2, midX: col1_X + boxW + colGap/2 });
                    }
                });

                const leftAncYs = [targetY - 105, targetY - 38, targetY + 38, targetY + 105];
                const leftAncList = [
                    { data: ancData.sireSide[0], fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.sireSide[1], fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.damSide[1],  fallbackBreed: targetItem.breed || 'LY' },
                    { data: ancData.damSide[2],  fallbackBreed: targetItem.breed || 'LY' }
                ];

                leftAncList.forEach((itemObj, idx) => {
                    const a = itemObj.data;
                    if (!a || !a.name || a.name === '' || a.name === '-') return;
                    const nodeY = leftAncYs[idx];
                    const div = document.createElement('div');
                    div.className = `tree-node ${getBreedClass(a.name, itemObj.fallbackBreed)}`;
                    div.style.left = col0_X + 'px'; div.style.top = nodeY + 'px';
                    div.style.width = boxW + 'px'; div.style.height = boxH + 'px';
                    div.innerHTML = `<span class="sub-label">${a.label}</span><b>${cleanVal(a.name)}</b>`;
                    attachNodeClick(div, a.name);
                    container.appendChild(div);

                    let targetDestY = (idx < 2) 
                        ? (leftParents[0].exists ? parentY_Sire + boxH/2 : targetY + boxH/2)
                        : (leftParents[1].exists ? parentY_Dam + boxH/2  : targetY + boxH/2);

                    linesToDraw.push({ x1: col0_X + boxW, y1: nodeY + boxH/2, x2: col1_X, y2: targetDestY, midX: col0_X + boxW + colGap/2 });
                });
            }

            const targetDiv = document.createElement('div');
            targetDiv.className = `tree-node origin-target`;
            targetDiv.style.left = col2_X + 'px'; targetDiv.style.top = targetY + 'px';
            targetDiv.style.width = (boxW + 6) + 'px'; targetDiv.style.height = (boxH + 6) + 'px';
            const sexLabel = isMale ? '🎯 Target Sire' : '🎯 Target Dam';
            targetDiv.innerHTML = `<span class="sub-label" style="color:#fef08a;">${sexLabel}</span><b>${cleanVal(targetEar)}</b>`;
            container.appendChild(targetDiv);

            if (mateList.length > 0) {
                mateList.forEach((m, idx) => {
                    const mateY = targetY + (idx - (totalMates - 1) / 2) * (rowGap * 2.0);
                    const mDiv = document.createElement('div');
                    const nodeClass = isMale ? 'mate-node-dam' : 'mate-node-sire';
                    mDiv.className = `tree-node ${nodeClass} ${getBreedClass(m.name, targetItem.breed || 'LY')}`;
                    mDiv.style.left = col3_X + 'px'; mDiv.style.top = mateY + 'px';
                    mDiv.style.width = boxW + 'px'; mDiv.style.height = boxH + 'px';
                    const parityText = (m.parity && m.parity !== '-') ? ` (P.${m.parity})` : '';
                    mDiv.innerHTML = `<span class="sub-label">${m.label}${parityText}</span><b>${cleanVal(m.name)}</b>`;
                    attachNodeClick(mDiv, m.name);
                    container.appendChild(mDiv);

                    linesToDraw.push({ x1: col2_X + boxW, y1: targetY + boxH/2, x2: col3_X, y2: mateY + boxH/2, midX: col2_X + boxW + colGap/2 });

                    const boarItem = pedigreeList.find(it => {
                        const itEar = it.ear || getValueFromMultiKeys(it, ['耳號', 'Ear Tag']);
                        return String(itEar).toLowerCase() === String(m.name).toLowerCase();
                    });

                    let curSireName = boarItem ? shortenAncestorName(getValueFromMultiKeys(boarItem, ['sire_sire', '1st Sire', '父親'])) : '-';
                    let curDamName  = boarItem ? shortenAncestorName(getValueFromMultiKeys(boarItem, ['gen1_dam', '1st Dam', '母親'])) : '-';
                    let curG1 = boarItem ? shortenAncestorName(getValueFromMultiKeys(boarItem, ['Sire美系父親名(祖父)', 'sire_sire', '祖父'])) : '-';
                    let curG2 = boarItem ? shortenAncestorName(getValueFromMultiKeys(boarItem, ['Dam Name美系母親名(祖母)', 'sire_dam', '祖母'])) : '-';

                    if (curSireName && curSireName !== '-') {
                        const sireDiv = document.createElement('div');
                        sireDiv.className = `tree-node ${getBreedClass(curSireName, m.name)}`;
                        sireDiv.style.left = col4_X + 'px'; sireDiv.style.top = (mateY - 22) + 'px';
                        sireDiv.style.width = boxW + 'px'; sireDiv.style.height = boxH + 'px';
                        sireDiv.innerHTML = `<span class="sub-label">♂ 1st Sire</span><b>${curSireName}</b>`;
                        attachNodeClick(sireDiv, curSireName);
                        container.appendChild(sireDiv);
                        linesToDraw.push({ x1: col3_X + boxW, y1: mateY + boxH/2, x2: col4_X, y2: mateY - 22 + boxH/2, midX: col3_X + boxW + colGap/2 });
                    }

                    if (curDamName && curDamName !== '-') {
                        const damDiv = document.createElement('div');
                        damDiv.className = `tree-node ${getBreedClass(curDamName, m.name)}`;
                        damDiv.style.left = col4_X + 'px'; damDiv.style.top = (mateY + 22) + 'px';
                        damDiv.style.width = boxW + 'px'; damDiv.style.height = boxH + 'px';
                        damDiv.innerHTML = `<span class="sub-label">♀ 1st Dam</span><b>${curDamName}</b>`;
                        attachNodeClick(damDiv, curDamName);
                        container.appendChild(damDiv);
                        linesToDraw.push({ x1: col3_X + boxW, y1: mateY + boxH/2, x2: col4_X, y2: mateY + 22 + boxH/2, midX: col3_X + boxW + colGap/2 });
                    }

                    if (curG1 && curG1 !== '-') {
                        const g1Div = document.createElement('div');
                        g1Div.className = `tree-node ${getBreedClass(curG1, curSireName)}`;
                        g1Div.style.left = col5_X + 'px'; g1Div.style.top = (mateY - 45) + 'px';
                        g1Div.style.width = boxW + 'px'; g1Div.style.height = boxH + 'px';
                        g1Div.innerHTML = `<span class="sub-label">♂ Sire\'s Sire</span><b>${curG1}</b>`;
                        attachNodeClick(g1Div, curG1);
                        container.appendChild(g1Div);
                        linesToDraw.push({ x1: col4_X + boxW, y1: mateY - 22 + boxH/2, x2: col5_X, y2: mateY - 45 + boxH/2, midX: col4_X + boxW + colGap/2 });
                    }

                    if (curG2 && curG2 !== '-') {
                        const g2Div = document.createElement('div');
                        g2Div.className = `tree-node ${getBreedClass(curG2, curSireName)}`;
                        g2Div.style.left = col5_X + 'px'; g2Div.style.top = (mateY + 9) + 'px';
                        g2Div.style.width = boxW + 'px'; g2Div.style.height = boxH + 'px';
                        g2Div.innerHTML = `<span class="sub-label">♀ Sire\'s Dam</span><b>${curG2}</b>`;
                        attachNodeClick(g2Div, curG2);
                        container.appendChild(g2Div);
                        linesToDraw.push({ x1: col4_X + boxW, y1: mateY - 22 + boxH/2, x2: col5_X, y2: mateY + 9 + boxH/2, midX: col4_X + boxW + colGap/2 });
                    }
                });
            }

            requestAnimationFrame(() => {
                canvas.width = totalWidth;
                canvas.height = finalCanvasHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                linesToDraw.forEach(l => {
                    drawOrthogonalLine(ctx, l.x1, l.y1, l.x2, l.y2, l.midX);
                });
            });
        }

        function exportTreeAsHighResPNG(containerId, canvasId, fileNamePrefix) {
            const container = document.getElementById(containerId);
            const canvas = document.getElementById(canvasId);
            const rawQuery = document.getElementById('earInput').value.trim() || 'ALL';
            if (!container || !canvas) return;

            html2canvas(container, { scale: 2.5, useCORS: true, backgroundColor: '#ffffff' }).then(canvasExport => {
                canvasExport.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `${fileNamePrefix}_${rawQuery}_${getTodayDateStr()}.png`;
                    link.href = url;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                }, 'image/png', 1.0);
            });
        }
    </script>
