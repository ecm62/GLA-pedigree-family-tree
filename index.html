<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>標準血統世系階梯圖系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 15px; background-color: #f8f9fa; }
        
        /* 上方搜尋欄 */
        .control-bar { background: #ffffff; padding: 12px 18px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 12px; display: flex; gap: 15px; align-items: center; }
        input[type="text"] { padding: 6px 12px; font-size: 15px; border: 1px solid #ced4da; border-radius: 4px; width: 240px; }
        .btn { padding: 6px 16px; font-size: 15px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #0b5ed7; }
        
        /* 頂部固定數據卡 */
        #dataCard { background-color: #ffffff; border: 2px solid #0d6efd; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .card-title { font-size: 15px; color: #0d6efd; font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed #0d6efd; padding-bottom: 4px; }
        .compact-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .compact-table td { border: 1px solid #dee2e6; padding: 5px 8px; }
        .compact-table .lbl { background-color: #f1f3f5; font-weight: bold; width: 14%; text-align: right; }
        .compact-table .val { width: 36%; font-weight: 500; color: #111; }

        /* 🌟 血統世系階梯圖容器 (網格精準定位) */
        #pedigreeTreeContainer {
            position: relative;
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 20px;
            min-height: 500px;
            overflow-x: auto;
        }

        /* 方框通用樣式 */
        .p-box {
            position: absolute;
            border: 2px solid #000000;
            background-color: #ffffff;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.05);
            z-index: 2;
        }

        /* 標籤對應顏色與層級 */
        .box-ancestor { width: 180px; height: 42px; background-color: #ffffff; }
        .box-target { width: 180px; height: 50px; background-color: #e7f5ff; border-color: #0d6efd; color: #0d6efd; font-size: 16px; }
        .box-gen { width: 180px; height: 42px; background-color: #ffffff; }

        canvas#lineCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 控制列 -->
    <div class="control-bar">
        <div>
            <label for="earInput"><strong>查詢母豬耳號：</strong></label>
            <input type="text" id="earInput" placeholder="例如: DD26000" onkeydown="if(event.key==='Enter') searchPedigree()">
            <button class="btn" onclick="searchPedigree()">🔍 查詢世系表</button>
        </div>
    </div>

    <!-- 頂部數據摘要卡 -->
    <div id="dataCard">
        <div class="card-title" id="cardTitle">📌 查詢母豬生產與指數摘要</div>
        <div id="cardBody">
            <table class="compact-table">
                <tr>
                    <td class="lbl">耳號 / 性別:</td>
                    <td class="val" id="summaryEar">-</td>
                    <td class="lbl">生產指數:</td>
                    <td class="val" id="summaryIndex">SPI: - | MLI: - | TSI: -</td>
                </tr>
                <tr>
                    <td class="lbl">出生日期:</td>
                    <td class="val" id="summaryDob">-</td>
                    <td class="lbl">同胎數據:</td>
                    <td class="val" id="summaryBorn">總產: - | 活胎: - | 離乳: -</td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 🌟 世系階梯繪圖畫布 -->
    <div id="pedigreeTreeContainer">
        <canvas id="lineCanvas"></canvas>
        <div id="boxesContainer"></div>
    </div>

    <script>
        let pedigreeData = {};

        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                pedigreeData = data;
                // 預設填入第一筆耳號
                const firstEar = Object.keys(pedigreeData)[0];
                if (firstEar) {
                    document.getElementById('earInput').value = firstEar;
                    drawPedigree(firstEar);
                }
            });

        function searchPedigree() {
            const earInput = document.getElementById('earInput').value.trim().toUpperCase();
            if (!earInput) return;

            // 模糊搜尋適應
            const matchedEar = Object.keys(pedigreeData).find(k => k.toUpperCase().includes(earInput));

            if (matchedEar) {
                drawPedigree(matchedEar);
            } else {
                alert(`查無此母豬耳號: ${earInput}`);
            }
        }

        // 🌟 完全依照圖片座標精準繪製階梯結構
        function drawPedigree(ear) {
            const data = pedigreeData[ear];
            if (!data) return;

            // 更新頂部數據
            document.getElementById('cardTitle').innerText = `📌 查詢母豬：${data.ear} - 生產與指數摘要`;
            document.getElementById('summaryEar').innerHTML = `<b>${data.ear}</b> (${data.sex || 'FEMALE'})`;
            
            const details = data.details || {};
            const getV = (kList) => {
                for (let k of kList) {
                    const foundKey = Object.keys(details).find(key => key.toLowerCase().includes(k.toLowerCase()));
                    if (foundKey && details[foundKey]) return details[foundKey];
                }
                return '-';
            };

            document.getElementById('summaryIndex').innerHTML = `<b>SPI:</b> ${getV(['SPI'])} | <b>MLI:</b> ${getV(['MLI'])} | <b>TSI:</b> ${getV(['TSI'])}`;
            document.getElementById('summaryDob').innerText = getV(['DOB', '出生']);
            document.getElementById('summaryBorn').innerHTML = `總產: <b>${getV(['total born', '總生'])}</b> | 活胎: <b>${getV(['born alive', '活胎'])}</b> | 離乳: <b>${getV(['weaning', '離乳'])}</b>`;

            const container = document.getElementById('boxesContainer');
            container.innerHTML = '';

            // 定義圖片中的欄位座標 (X, Y)
            const boxWidth = 180;
            const boxHeight = 42;
            const colGap = 80;
            const rowGap = 20;

            const col0_X = 40;                     // 左側 祖輩欄
            const col1_X = col0_X + boxWidth + colGap; // 中間 查詢母豬欄
            const col2_X = col1_X + boxWidth + colGap; // 右側 第一代欄
            const col3_X = col2_X + boxWidth + colGap; // 右側 第二代欄

            const row0_Y = 30;
            const row1_Y = row0_Y + boxHeight + rowGap;
            const row2_Y = row1_Y + boxHeight + rowGap;
            const row3_Y = row2_Y + boxHeight + rowGap;

            // 建立方框 HTML
            const boxes = [
                { id: 'sire_sire', text: `Sire 美系父親名(祖父)<br><b>${data.sire_sire}</b>`, x: col0_X, y: row0_Y, cls: 'box-ancestor' },
                { id: 'sire_dam',  text: `Dam Name 美系母親名(祖母)<br><b>${data.sire_dam}</b>`, x: col0_X, y: row1_Y, cls: 'box-ancestor' },
                { id: 'dam_sire',  text: `Sire 美系父親名(外公)<br><b>${data.dam_sire}</b>`, x: col0_X, y: row2_Y, cls: 'box-ancestor' },
                { id: 'dam_dam',   text: `Dam Name 美系母親名(外婆)<br><b>${data.dam_dam}</b>`, x: col0_X, y: row3_Y, cls: 'box-ancestor' },
                
                { id: 'target_ear', text: `查詢母豬<br><b>${data.ear}</b>`, x: col1_X, y: (row1_Y + row2_Y)/2, cls: 'box-target' },
                
                { id: 'gen1_sire', text: `第一代公<br><b>${data.gen1_sire}</b>`, x: col2_X, y: row1_Y + 10, cls: 'box-gen' },
                { id: 'gen2_sire', text: `第二代公<br><b>${data.gen2_sire}</b>`, x: col3_X, y: row3_Y, cls: 'box-gen' }
            ];

            boxes.forEach(b => {
                const div = document.createElement('div');
                div.className = `p-box ${b.cls}`;
                div.style.left = b.x + 'px';
                div.style.top = b.y + 'px';
                div.innerHTML = b.text;
                container.appendChild(div);
            });

            // 設定 Canvas 繪畫精準 90 度直角階梯連接線
            const treeContainer = document.getElementById('pedigreeTreeContainer');
            const canvas = document.getElementById('lineCanvas');
            canvas.width = treeContainer.clientWidth;
            canvas.height = Math.max(treeContainer.clientHeight, 420);

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            // 畫 90 度直角折線函數
            function drawOrthogonalLine(x1, y1, x2, y2, midX) {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(midX, y1);
                ctx.lineTo(midX, y2);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // 1. 左側祖輩連結到中間母豬
            const targetLeftX = col1_X;
            const targetLeftY = ((row1_Y + row2_Y)/2) + (boxHeight/2);
            const midLeftX = col0_X + boxWidth + (colGap / 2);

            drawOrthogonalLine(col0_X + boxWidth, row0_Y + boxHeight/2, targetLeftX, targetLeftY, midLeftX);
            drawOrthogonalLine(col0_X + boxWidth, row1_Y + boxHeight/2, targetLeftX, targetLeftY, midLeftX);
            drawOrthogonalLine(col0_X + boxWidth, row2_Y + boxHeight/2, targetLeftX, targetLeftY, midLeftX);
            drawOrthogonalLine(col0_X + boxWidth, row3_Y + boxHeight/2, targetLeftX, targetLeftY, midLeftX);

            // 2. 中間母豬連結到右側第一代與第二代公豬
            const targetRightX = col1_X + boxWidth;
            const targetRightY = targetLeftY;
            const midRightX = col1_X + boxWidth + (colGap / 2);

            drawOrthogonalLine(targetRightX, targetRightY, col2_X, row1_Y + 10 + boxHeight/2, midRightX);
            drawOrthogonalLine(targetRightX, targetRightY, col3_X, row3_Y + boxHeight/2, midRightX);
        }
    </script>
</body>
</html>
