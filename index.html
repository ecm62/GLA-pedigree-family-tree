<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLA Pedigree Search System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* [所有 CSS 樣式維持之前的緊湊專業版] */
        body { font-family: sans-serif; padding: 10px; background: #f4f6f9; font-size: 12px; }
        .data-table-wrapper { overflow-x: auto; border: 1px solid #ccc; }
        .excel-data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .excel-data-table th, .excel-data-table td { border: 1px solid #ccc; padding: 5px; text-align: center; }
        .tree-node { position: absolute; border: 1px solid #333; padding: 3px; font-size: 9px; background: #fff; }
    </style>
</head>
<body>
    <div class="control-bar">
        <input type="text" id="earInput" placeholder="Enter Ear Tag (e.g. 3773)">
        <button onclick="searchPedigree()">Search</button>
    </div>

    <div id="permanentCard">
        <div class="data-table-wrapper">
            <table class="excel-data-table">
                <thead>
                    <tr>
                        <th>Ear Tag</th><th>Breed</th><th>Sex</th><th>Birth Date</th><th>Age</th>
                        <th>Mating</th><th>Farrow</th><th>Parity</th><th>Sire</th>
                        <th>Total</th><th>Alive</th><th>Wean</th>
                        <th>SPI</th><th>MLI</th><th>TSI</th><th>TNB</th><th>NBA</th>
                    </tr>
                </thead>
                <tbody id="excelTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let pedigreeList = [];
        fetch('data.json?t=' + new Date().getTime()).then(r => r.json()).then(d => pedigreeList = d);

        function calculateAgeInDays(breed, birthDateStr, endDateStr) {
            if (String(breed).includes('LY') || !birthDateStr || birthDateStr === '-') return '-';
            try {
                const b = new Date(birthDateStr.replace(/-/g, '/'));
                const e = endDateStr && endDateStr !== '-' ? new Date(endDateStr.replace(/-/g, '/')) : new Date();
                const days = Math.floor((e - b) / (1000 * 60 * 60 * 24));
                return days > 0 ? days + 'd' : '-';
            } catch(e) { return '-'; }
        }

        function searchPedigree() {
            const raw = document.getElementById('earInput').value.trim().toLowerCase();
            const tbody = document.getElementById('excelTableBody');
            tbody.innerHTML = '';
            
            const results = pedigreeList.filter(item => String(item.ear).toLowerCase().includes(raw));
            
            results.forEach(item => {
                const age = calculateAgeInDays(item.breed, item.birth_date, item.dob);
                tbody.innerHTML += `<tr>
                    <td>${item.ear}</td><td>${item.breed}</td><td>${item.sex}</td>
                    <td>${item.birth_date}</td><td>${age}</td>
                    <td>${item.details['配種日期'] || '-'}</td><td>${item.dob}</td><td>${item.parity}</td><td>${item.mate}</td>
                    <td>${item.total_born}</td><td>${item.born_alive}</td><td>${item.weaning}</td>
                    <td>${item.spi}</td><td>${item.mli}</td><td>${item.tsi}</td>
                    <td>${item.tnb}</td><td>${item.nba}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
