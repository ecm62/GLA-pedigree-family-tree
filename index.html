<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLA Pedigree Family Tree Searching System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif; margin: 0; padding: 12px; background-color: #f4f6f9; color: #333; }
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: #ffffff; padding: 32px 40px; border-radius: 12px; text-align: center; max-width: 380px; width: 90%; }
        .auth-input { width: 100%; padding: 10px; font-size: 15px; border: 1.5px solid #cbd5e1; border-radius: 6px; margin-bottom: 16px; text-align: center; outline: none; }
        .auth-btn { width: 100%; padding: 10px; font-size: 15px; font-weight: bold; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .auth-error { color: #dc2626; font-size: 13px; margin-top: 10px; display: none; font-weight: bold; }

        .system-header-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; padding: 14px 20px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
        .control-bar { background: #ffffff; padding: 12px 16px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
        input[type="text"] { padding: 6px 12px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; width: 280px; }
        .btn { padding: 6px 16px; font-size: 14px; background-color: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .tree-card { position: relative; width: 100%; min-height: 480px; overflow-x: auto; overflow-y: hidden; background: #fafbfc; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 16px; padding: 14px; }
        .tree-node { position: absolute; border: 2px solid #334155; border-radius: 6px; text-align: center; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; padding: 3px; box-sizing: border-box; }
        
        .node-target { border: 3px solid #f59e0b !important; background-color: #1d4ed8 !important; color: #ffffff !important; font-size: 12px !important; font-weight: 800 !important; }
        .node-sire   { border-color: #2563eb !important; background-color: #eff6ff !important; color: #1e3a8a !important; font-weight: bold; }
        .node-dam    { border-color: #e11d48 !important; background-color: #fff1f2 !important; color: #9f1239 !important; font-weight: bold; }
        .node-mate   { border: 2px dashed #f43f5e !important; background-color: #fff1f2 !important; color: #9f1239 !important; }
        .node-ancestor { border-color: #0284c7 !important; background-color: #e0f2fe !important; color: #0369a1 !important; font-weight: bold; }

        canvas.lineCanvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
        .sub-label { font-size: 8px; opacity: 0.85; margin-bottom: 1px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h2>🔒 System Authentication (系統登入)</h2>
            <input type="password" id="authPassword" class="auth-input" placeholder="Password (密碼)" onkeydown="if(event.key==='Enter') verifyPassword()">
            <button class="auth-btn" onclick="verifyPassword()">Login</button>
            <div id="authError" class="auth-error">⚠️ 密碼錯誤</div>
        </div>
    </div>

    <div class="system-header-banner">
        <h1 style="margin:0; font-size:19px;">GLA Pedigree Family Tree Searching System</h1>
        <p style="margin:4px 0 0 0; font-size:12px; opacity:0.85;">0代美系種源與1/2代自繁育種全系譜拓撲家族樹</p>
    </div>

    <div class="control-bar">
        <label for="earInput"><strong>耳號查詢 (Target Search):</strong></label>
        <input type="text" id="earInput" placeholder="例如 DD26002, D1071, D1401, D1415" onkeydown="if(event.key==='Enter') searchPedigree()">
        <button class="btn" onclick="searchPedigree()">🔍 展開血統樹</button>
    </div>

    <div class="tree-card" id="treeCard">
        <div style="font-weight:bold; font-size:14px; color:#0d6efd; margin-bottom:12px;">
            🌳 核心育種系譜拓撲家族樹 (Topology Breeding Family Tree)
        </div>
        <div id="boxesContainer" style="position:relative; width:100%; min-height:450px;"></div>
        <canvas class="lineCanvas" id="treeCanvas"></canvas>
    </div>

    <script>
        let pedigreeList = [];
        let isAuthorized = false;

        function verifyPassword() {
            const p = document.getElementById('authPassword').value.trim();
            if (['yang3746', 'rendy223269', 'gla8888'].includes(p)) {
                isAuthorized = true;
                document.getElementById('authOverlay').style.display = 'none';
                loadPedigreeData();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        }

        function loadPedigreeData() {
            fetch('data.json?nocache=' + new Date().getTime())
                .then(res => res.json())
                .then(data => { pedigreeList = data; })
                .catch(err => console.error("Load failed"));
        }

        function drawConnectLine(ctx, elem1, elem2) {
            if (!elem1 || !elem2) return;
            const x1 = elem1.offsetLeft + elem1.offsetWidth;
            const y1 = elem1.offsetTop + elem1.offsetHeight / 2;
            const x2 = elem2.offsetLeft;
            const y2 = elem2.offsetTop + elem2.offsetHeight / 2;
            const midX = x1 + (x2 - x1) / 2;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(midX, y1);
            ctx.lineTo(midX, y2);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.8;
            ctx.stroke();
        }

        function searchPedigree() {
            if (!isAuthorized || !pedigreeList.length) return;
            const query = document.getElementById('earInput').value.trim().toUpperCase();
            if (!query) return;

            const targetItem = pedigreeList.find(i => String(i.ear).toUpperCase() === query) ||
                               pedigreeList.find(i => String(i.ear).toUpperCase().includes(query));
            if (!targetItem) {
                alert("查無此耳號資料！");
                return;
            }

            renderTree(targetItem);
        }

        function renderTree(target) {
            const container = document.getElementById('boxesContainer');
            const canvas = document.getElementById('treeCanvas');
            container.innerHTML = '';

            const boxW = 120, boxH = 34, colGap = 45, rowGap = 55;
            const col0_X = 20;
            const col1_X = col0_X + boxW + colGap;
            const col2_X = col1_X + boxW + colGap; // Target
            const col3_X = col2_X + boxW + colGap; // 配種公
            const col4_X = col3_X + boxW + colGap; // 配種公父親
            const col5_X = col4_X + boxW + colGap; // 配種公祖代

            // 抓取與目標配種過的所有公豬
            let mateSires = [];
            pedigreeList.forEach(i => {
                if (String(i.ear).toUpperCase() === String(target.ear).toUpperCase() && i.mate && i.mate !== '-') {
                    if (!mateSires.includes(i.mate)) mateSires.push(i.mate);
                }
            });
            if (mateSires.length === 0 && target.mate && target.mate !== '-') {
                mateSires.push(target.mate);
            }

            const totalMates = Math.max(mateSires.length, 1);
            const totalH = Math.max(totalMates * rowGap * 2.2 + 160, 480);
            const totalW = col5_X + boxW + 80;

            container.style.height = totalH + 'px';
            container.style.width = totalW + 'px';

            const targetY = totalH / 2 - boxH / 2;
            const connections = [];

            // 1. 繪製核心主角 Target (Col 2)
            const targetDiv = createBox(col2_X, targetY, boxW, boxH, `🎯 核心主角 Target`, target.ear, 'node-target');
            container.appendChild(targetDiv);

            // 2. 繪製左側父親與母親 (Col 1)
            const sireDiv = createBox(col1_X, targetY - 45, boxW, boxH, `♂ 父親 (1st Sire)`, target.gen1_sire || '-', 'node-sire');
            const damDiv  = createBox(col1_X, targetY + 45, boxW, boxH, `♀ 母親 (1st Dam)`, target.gen1_dam || '-', 'node-dam');
            container.appendChild(sireDiv);
            container.appendChild(damDiv);
            connections.push({ from: sireDiv, to: targetDiv });
            connections.push({ from: damDiv, to: targetDiv });

            // 3. 繪製左側祖父祖母與外公外婆 (Col 0)
            const gsDiv = createBox(col0_X, targetY - 75, boxW, boxH, `♂ 祖父 (Sire's Sire)`, target.sire_sire || '-', 'node-ancestor');
            const gdDiv = createBox(col0_X, targetY - 15, boxW, boxH, `♀ 祖母 (Sire's Dam)`, target.sire_dam || '-', 'node-ancestor');
            const msDiv = createBox(col0_X, targetY + 15, boxW, boxH, `♂ 外公 (Dam's Sire)`, target.dam_sire || '-', 'node-ancestor');
            const mdDiv = createBox(col0_X, targetY + 75, boxW, boxH, `♀ 外婆 (Dam's Dam)`, target.dam_dam || '-', 'node-ancestor');
            container.appendChild(gsDiv);
            container.appendChild(gdDiv);
            container.appendChild(msDiv);
            container.appendChild(mdDiv);
            connections.push({ from: gsDiv, to: sireDiv });
            connections.push({ from: gdDiv, to: sireDiv });
            connections.push({ from: msDiv, to: damDiv });
            connections.push({ from: mdDiv, to: damDiv });

            // 4. 繪製右側當胎配種公豬及其父系祖代 (Col 3, 4, 5)
            mateSires.forEach((mateEar, idx) => {
                const mateY = targetY + (idx - (totalMates - 1) / 2) * (rowGap * 2.2);
                const mateDiv = createBox(col3_X, mateY, boxW, boxH, `♂ 當胎配種公`, mateEar, 'node-mate');
                container.appendChild(mateDiv);
                connections.push({ from: targetDiv, to: mateDiv });

                // 查出該配種公豬的美國血統
                const mateObj = pedigreeList.find(i => String(i.ear).toUpperCase() === mateEar.toUpperCase());
                if (mateObj) {
                    const mSireDiv = createBox(col4_X, mateY, boxW, boxH, `♂ 父親 (1st Sire)`, mateObj.gen1_sire || '-', 'node-sire');
                    container.appendChild(mSireDiv);
                    connections.push({ from: mateDiv, to: mSireDiv });

                    const mGSDiv = createBox(col5_X, mateY - 22, boxW, boxH, `♂ 祖父 (Sire's Sire)`, mateObj.sire_sire || '-', 'node-ancestor');
                    const mGDDiv = createBox(col5_X, mateY + 22, boxW, boxH, `♀ 祖母 (Sire's Dam)`, mateObj.sire_dam || '-', 'node-ancestor');
                    container.appendChild(mGSDiv);
                    container.appendChild(mGDDiv);
                    connections.push({ from: mSireDiv, to: mGSDiv });
                    connections.push({ from: mSireDiv, to: mGDDiv });
                }
            });

            // 繪製連線
            requestAnimationFrame(() => {
                canvas.width = container.scrollWidth;
                canvas.height = container.scrollHeight;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                connections.forEach(pair => {
                    drawConnectLine(ctx, pair.from, pair.to);
                });
            });
        }

        function createBox(x, y, w, h, label, name, className) {
            const div = document.createElement('div');
            div.className = `tree-node ${className}`;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.width = w + 'px';
            div.style.height = h + 'px';
            div.innerHTML = `<span class="sub-label">${label}</span><b>${name}</b>`;
            return div;
        }
    </script>
</body>
</html>
