name: Auto Update Pedigree Data

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時自動更新一次
  workflow_dispatch: # 允許手動點擊 Run workflow

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🌟 關鍵修復：補上安裝 requests 與 pandas 套件的步驟
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run script to generate data.json
        run: python generate_tree.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data.json from Google Sheet" && git push)
