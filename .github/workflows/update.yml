name: Auto Update Data from Google Sheet

on:
  schedule:
    - cron: '0 0 * * *' # 每天自動更新一次
  workflow_dispatch: # 支援在網頁按按鈕隨時手動更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pandas requests

      - name: Run Script to fetch Google Sheet
        run: |
          python generate_tree.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "Auto update data.json from Google Sheet" || exit 0
          git push
