name: Auto update data.json from Google Sheet

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小時自動同步一次，或可改為 push 觸發
  workflow_dispatch: # 支援手動點擊立即更新

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run script to generate data.json
        run: |
          python generate_tree.py # 或您的資料轉換 Python 腳本

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update data.json from Google Sheet" && git push)
